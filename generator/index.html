    .preview {
      min-height: 12rem;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background-color: #e3e6e9;
      background-image: conic-gradient(#f6f7f8 25%, #e3e6e9 0 50%, #f6f7f8 0 75%, #e3e6e9 0);
      background-size: 20px 20px;
      border-radius: var(--pico-border-radius);
    }
    .preview[data-backdrop="dark"] { background: #14271b; }
    canvas { display: block; max-width: 100%; height: auto; }
    [role="status"] { min-height: 1.5em; margin: 0; }
    #download { width: auto; }

<body>
  <header class="container">
    <nav aria-label="Main navigation">
      <ul><li><strong>DeerInABox</strong></li></ul>
      <ul><li><button type="button" class="secondary outline" id="theme" aria-label="Dark mode" title="Dark mode">☾</button></li></ul>
    </nav>
    <h1>Text Generator</h1>
  </header>
  <main class="container">
    <form id="controls">
      <label for="wordmark">Text</label>
      <input id="wordmark" name="wordmark" type="text" maxlength="40" value="DeerInABox" spellcheck="false" autocomplete="off">
      <div class="grid">
        <label for="scale">Scale
          <select id="scale" name="scale">
            <option value="1">1×</option>
            <option value="2" selected>2×</option>
          </select>
        </label>
        <label for="backdrop">Background
          <select id="backdrop" name="backdrop">
            <option value="transparent">Checkerboard</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>
      <fieldset>
        <label for="underline"><input id="underline" name="underline" type="checkbox" role="switch" checked> Accent lines</label>
      </fieldset>
    </form>
    <article aria-label="Preview">
      <div class="preview" id="preview" data-backdrop="transparent">
        <canvas id="canvas" width="1" height="1" role="img" aria-label="Wordmark preview"></canvas>
      </div>
      <footer><small id="status" role="status">Loading…</small></footer>
    </article>
    <button type="button" id="download" disabled>Download PNG</button>
  </main>
  <script>
    'use strict';
    const field = document.querySelector('#wordmark');
    const scaleField = document.querySelector('#scale');
    const underline = document.querySelector('#underline');
    const backdrop = document.querySelector('#backdrop');
    const preview = document.querySelector('#preview');
    const canvas = document.querySelector('#canvas');
    const status = document.querySelector('#status');
    const download = document.querySelector('#download');
    const theme = document.querySelector('#theme');
    const context = canvas.getContext('2d');
    const font = '160px "Minecraft Ten"';
    const padding = 24;
    let fontReady = false;
    let queued = false;

    function render() {
      if (!fontReady) return;
      const word = field.value.trim();
      if (!word) {
        canvas.hidden = true;
        download.disabled = true;
        status.textContent = 'Enter text.';
        return;
      }
      context.font = font;
      const metrics = context.measureText(word);
      const inkWidth = Math.ceil(metrics.actualBoundingBoxLeft + metrics.actualBoundingBoxRight);
      const inkHeight = Math.ceil(metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent);
      const scale = Number(scaleField.value);
      const width = 2 * padding + Math.max(inkWidth + 4, underline.checked ? 231 : 0);
      const height = 2 * padding + Math.max(inkHeight + 16, underline.checked ? 153 : 0);
      if (width * scale > 8192) {
        canvas.hidden = true;
        download.disabled = true;
        status.textContent = 'Use 1× or shorter text.';
        return;
      }
      canvas.width = width * scale;
      canvas.height = height * scale;
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.font = font;
      context.textBaseline = 'alphabetic';
      context.lineJoin = 'round';
      const x = padding + metrics.actualBoundingBoxLeft;
      const y = padding + metrics.actualBoundingBoxAscent;
      context.strokeStyle = '#013C16';
      context.fillStyle = '#136417';
      context.lineWidth = 16;
      for (let depth = 15; depth >= 3; depth -= 1) {
        context.strokeText(word, x + 3, y + depth);
        context.fillText(word, x + 3, y + depth);
      }
      context.strokeStyle = '#024014';
      context.lineWidth = 14;
      context.strokeText(word, x, y);
      const gradient = context.createLinearGradient(0, padding + 25, 0, padding + 122);
      gradient.addColorStop(0, '#F3FC07');
      gradient.addColorStop(1, '#9DCB03');
      context.fillStyle = gradient;
      context.fillText(word, x, y);
      if (underline.checked) {
        const lineY = padding + Math.max(147, inkHeight + 28);
        for (const [offset, length, color] of [[0, 169, '#B2C965'], [179, 29, '#849A49'], [218, 13, '#E2B867']]) {
          context.fillStyle = color;
          context.fillRect(padding + offset, lineY, length, 6);
        }
      }
      canvas.style.width = width + 'px';
      canvas.hidden = false;
      canvas.setAttribute('aria-label', 'Preview of ' + word);
      download.disabled = false;
      status.textContent = canvas.width + ' × ' + canvas.height + ' px';
    }

    function scheduleRender() {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; render(); });
    }

    document.querySelector('#controls').addEventListener('submit', event => event.preventDefault());
    field.addEventListener('input', scheduleRender);
    scaleField.addEventListener('change', scheduleRender);
    underline.addEventListener('change', scheduleRender);
    backdrop.addEventListener('change', () => { preview.dataset.backdrop = backdrop.value; });
    theme.addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      theme.textContent = dark ? '☀' : '☾';
      theme.title = dark ? 'Light mode' : 'Dark mode';
      theme.setAttribute('aria-label', theme.title);
    });
    download.addEventListener('click', () => {
      render();
      if (download.disabled) return;
      const filename = field.value.trim().replace(/[^\p{L}\p{N}_-]+/gu, '-').replace(/^-+|-+$/g, '') || 'wordmark';
      canvas.toBlob(blob => {
        if (!blob) { status.textContent = 'Export failed.'; return; }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename + '.png';
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, 'image/png');
    });
    document.fonts.load(font, 'DeerInABox').then(loaded => {
      if (!loaded.length) throw new Error('Minecraft Ten missing');
      fontReady = true;
      render();
    }).catch(() => { status.textContent = 'Font failed to load.'; });
  </script>
</body>
</html>
